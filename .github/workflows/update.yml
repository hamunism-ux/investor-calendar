name: 更新行事曆資料

on:
  schedule:
    - cron: "0 23 * * *"   # 台北 07:00
    - cron: "0 11 * * *"   # 台北 19:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 抓取資料
        run: python scripts/update.py

      - name: 提交變更
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events_auto.json
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新事件資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
